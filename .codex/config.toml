[mcp_servers.unity]
command = "unity"
args = [ "mcp" ]

[mcp_servers.blender]
command = "C:\\Users\\golin\\.local\\bin\\uvx.exe"
args = ["mcp-for-blender==2.1.3"]
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers.blender.env]
BLENDER_HOST = "127.0.0.1"
BLENDER_PORT = "9876"
DISABLE_TELEMETRY = "true"
BLENDER_MCP_SAFE_MODE = "1"
PYTHONIOENCODING = "utf-8"

[mcp_servers.serena]
# One independently managed backend for this exact checkout; see Tools/Serena/README.md.
url = "http://127.0.0.1:9122/mcp"
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.empire-vault]
command = "C:\\Program Files\\nodejs\\node.exe"
args = [
  "C:\\Users\\golin\\AppData\\Local\\AI-Tools\\mcpvault\\0.16.0\\node_modules\\@bitbonsai\\mcpvault\\dist\\server.js",
  "F:\\Private\\empire-at-war\\EmpireAtWarDocumentation",
]

[mcp_servers.graphify]
enabled = true
command = "uvx"
args = [
  "--from", "graphifyy[mcp]==0.9.54",
  "python", "Tools/Graphify/run.py", "mcp",
]
enabled_tools = [
  "query_graph",
  "get_node",
  "get_neighbors",
  "god_nodes",
  "graph_stats",
  "shortest_path",
]
default_tools_approval_mode = "auto"
startup_timeout_sec = 45
tool_timeout_sec = 180

[mcp_servers.graphify.env]
GRAPHIFY_QUERY_LOG_DISABLE = "1"

# Compatibility tombstone for the retired mcp-for-unity server.
[mcp_servers.unityMCP]
enabled = false

# Use the project-local bridge instead of the inherited user-level connection.
[mcp_servers.penpot]
enabled = false

[mcp_servers.penpot-local]
command = "C:\\Program Files\\nodejs\\node.exe"
args = ["F:\\Private\\empire-at-war\\Tools\\Penpot\\start.mjs"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120
