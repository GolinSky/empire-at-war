function card(p){let fig=document.createElement('figure');let b=document.createElement('button');b.className='card';b.setAttribute('aria-label','Enlarge '+p.name);let im=document.createElement('img');im.src=p.src;im.alt=p.name+' planet preview';im.width=1344;im.height=564;b.append(im);b.onclick=()=>openPlanet(p);let cap=document.createElement('figcaption');cap.className='caption';let name=document.createElement('span');name.textContent=p.name;let tag=document.createElement('span');tag.className='tag';tag.textContent=p.reference?'EXISTING REFERENCE':'NEW';cap.append(name,tag);fig.append(b,cap);fig.dataset.name=p.name.toLowerCase();return fig;}

const search=document.querySelector('#search');function filter(){let n=0;[...gallery.children].forEach(f=>{f.hidden=!f.dataset.name.includes(search.value.toLowerCase());if(!f.hidden)n++});document.querySelector('#count').textContent=n+' / 55 new previews';}search.oninput=filter;document.querySelector('#reset').onclick=()=>{search.value='';filter()};document.querySelector('#cols').onchange=e=>gallery.style.gridTemplateColumns='repeat('+e.target.value+',minmax(0,1fr))';document.querySelector('#close').onclick=()=>detail.close();detail.onclick=e=>{if(e.target===detail)detail.close()};filter();
